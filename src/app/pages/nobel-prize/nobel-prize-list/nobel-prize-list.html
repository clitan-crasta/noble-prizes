<section id="filter-section">
    <app-nobel-prize-filter (applyFilterEvent)="applyFilter($event)"></app-nobel-prize-filter>
</section>

<section id="nobel-prize-list">
    @if (loading()) {
    <div class="table-loader">
        <mat-spinner diameter="48"></mat-spinner>
    </div>
    }
    @else {
    <table mat-table [dataSource]="dataSource" id="mat-table" class="mat-elevation-z8">
        <ng-container matColumnDef="winers">
            <th mat-header-cell *matHeaderCellDef>Laureates</th>
            <td mat-cell *matCellDef="let element">
                @for (item of element?.laureates; track item?.id) {
                <p class="highlight flex-center">
                    {{item.fullName?.en}}
                    <mat-icon class="open-in-icon" (click)="showMoreDetails(item.id)"
                        fontIcon="open_in_new">open_in_new</mat-icon>
                </p>
                }
            </td>
        </ng-container>

        <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef> Category </th>
            <td mat-cell *matCellDef="let element">
                <mat-chip selected>{{ element.category[lang] }}</mat-chip>
            </td>
        </ng-container>

        <ng-container matColumnDef="awardYear">
            <th mat-header-cell *matHeaderCellDef> Award Year </th>
            <td mat-cell *matCellDef="let element">
                {{element.awardYear}}
            </td>
        </ng-container>

        <ng-container matColumnDef="dateAwarded">
            <th mat-header-cell *matHeaderCellDef> Date of Awarded </th>
            <td mat-cell *matCellDef="let element"> {{element.dateAwarded | date }} </td>
        </ng-container>

        <ng-container matColumnDef="prizeAmount">
            <th mat-header-cell *matHeaderCellDef> Prize Amount </th>
            <td mat-cell *matCellDef="let element"> {{element.prizeAmount | currency}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    }

    <mat-paginator [class.visiblity]="loading()" [length]="totalCount()" [pageSize]="defaultPageSize" [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChange($event)">
    </mat-paginator>
</section>
